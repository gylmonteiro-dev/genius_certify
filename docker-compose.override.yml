# Carregado automaticamente por `docker compose up` (dev local).
# Na VPS: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#         docker compose --env-file .env -f proxy/docker-compose.yml up -d
#         (rode o proxy a partir de proxy/ ou com -f, usando --env-file da raiz)
services:
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    ports:
      - "8000:8000"

  frontend:
    ports:
      # Host 3000 evita conflito com Apache na 80
      - "3000:80"
