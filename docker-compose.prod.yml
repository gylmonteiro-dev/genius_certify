# Produção na VPS (não carrega o override de portas locais):
#   docker network create edge   # uma vez
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env -f proxy/docker-compose.yml up -d
#
# Caddy (80/443) está em proxy/. DNS A/AAAA de $DOMAIN deve apontar para a VPS.

services:
  backend:
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}

  frontend:
    networks:
      - nexus
      - edge

  minio:
    networks:
      - nexus
      - edge

networks:
  edge:
    external: true
